services:
  # Provides an easy way to ensure slow-starting databases are ready when the tests run
  block-until-healthy:
    image: alpine:latest
    depends_on:
      cubrid:
        condition: service_healthy
      db2:
        condition: service_healthy
      sqlserver:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=fluentq
      - MYSQL_USER=fluentq
      - MYSQL_PASSWORD=fluentq
      - MYSQL_DATABASE=fluentq
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pfluentq"]
      interval: 10s
      timeout: 5s
      retries: 30

  postgresql:
    image: postgis/postgis:16-3.6-alpine
    platform: linux/amd64
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=fluentq
      - POSTGRES_PASSWORD=fluentq
      - POSTGRES_DB=fluentq
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluentq"]
      interval: 10s
      timeout: 5s
      retries: 30

  pgvector:
    image: pgvector/pgvector:0.8.7-pg16
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=fluentq
      - POSTGRES_PASSWORD=fluentq
      - POSTGRES_DB=fluentq
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluentq"]
      interval: 10s
      timeout: 5s
      retries: 30

  mariadb:
    image: mariadb:11.8
    ports:
      - "3307:3306"
    environment:
      - MARIADB_ROOT_PASSWORD=fluentq
      - MARIADB_DATABASE=fluentq
      - MARIADB_USER=fluentq
      - MARIADB_PASSWORD=fluentq
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30

  oracle:
    image: gvenzl/oracle-free:23.26.4-slim-faststart
    platform: linux/amd64
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=fluentq
      - APP_USER=fluentq
      - APP_USER_PASSWORD=fluentq
      - TZ=UTC
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30

  cubrid:
    image: cubrid/cubrid:11.4
    platform: linux/amd64
    ports:
      - "33000:33000"
      - "30000:30000"
      - "8001:8001"
      - "8002:8002"
      - "1523:1523"
    environment:
      - CUBRID_DB=demodb
    healthcheck:
      test: csql demodb -c "SELECT 1"
      interval: 5s
      timeout: 60s
      start_period: 60s

  mongo:
    image: mongo:9.0.8
    platform: linux/amd64
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 30

  db2:
    image: icr.io/db2_community/db2:12.1.5.0
    platform: linux/amd64
    privileged: true
    ports:
      - "50000:50000"
    environment:
      - DB2INST1_PASSWORD=a3sd!fDj
      - DB2INSTANCE=db2inst1
      - DBNAME=sample
      - LICENSE=accept
      - ARCHIVE_LOGS=false
      - AUTOCONFIG=false
    healthcheck:
      test: su - db2inst1 -c "db2 connect to $$DBNAME"
      interval: 5s
      timeout: 240s
      start_period: 240s

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    platform: linux/amd64
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Password1!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$SA_PASSWORD" -Q "SELECT 1" || exit 1
      interval: 5s
      timeout: 60s
      start_period: 60s

  firebird:
    image: firebirdsql/firebird:5
    ports:
      - "3050:3050"
    environment:
      - FIREBIRD_ROOT_PASSWORD=masterkey
      - FIREBIRD_DATABASE=fluentq.fdb
      - FIREBIRD_USER=fluentq
      - FIREBIRD_PASSWORD=fluentq
      - TZ=UTC
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/3050'"]
      interval: 5s
      timeout: 5s
      retries: 30
